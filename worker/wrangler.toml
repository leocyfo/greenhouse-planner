# Petit serveur de l'import depuis Hypixel (voir le README, section « Import depuis Hypixel »).
name = "greenhouse-planner-profiles"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Adresses du site autorisées à appeler le serveur, séparées par des virgules, sans « / » final
# (ex. "https://pseudo.github.io,http://localhost:5173"). Vide : toutes les origines.
ALLOWED_ORIGINS = "https://leocyfo.github.io,http://localhost:5173,http://localhost:5174"

# Cache des profils lus, pour épargner le quota de la clé Hypixel (voir le README). Sur un autre
# compte : `npx wrangler kv namespace create PROFILE_CACHE`, puis remplace l'id.
[[kv_namespaces]]
binding = "PROFILE_CACHE"
id = "0a71a939fe02498380033d0e9c790ca2"

# Recherches par visiteur (adresse IP) : 10 par minute au plus. namespace_id : numéro libre,
# propre à ce compte.
[[ratelimits]]
name = "SEARCH_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Budget global des requêtes Hypixel : 240 sur 5 minutes au plus pour tout le site, sous la limite
# de la clé (300), voir src/budget.ts. Un Durable Object (offre gratuite : stockage SQLite).
[[durable_objects.bindings]]
name = "HYPIXEL_BUDGET"
class_name = "HypixelBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HypixelBudget"]
